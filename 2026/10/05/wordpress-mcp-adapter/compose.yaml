name: lilting-wordpress-mcp
services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run lab.py prepare first}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f
    ports:
      - "127.0.0.1:${LABO_PORT:-8889}:80"
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
      LABO_QWEN_MODEL: ${LABO_QWEN_MODEL:-Qwen-Ambassador/Qwen3.8-Flash-Next}
    volumes: &wp_volumes
      - wordpress:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/labo-mcp:ro
      - ${LABO_WORK_DIR}/plugins/mcp-adapter:/var/www/html/wp-content/plugins/mcp-adapter:ro
      - ./fixtures:/labo-fixtures:ro
    secrets:
      - modelscope_key
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "33:33"
    environment: *wp_environment
    volumes: *wp_volumes
    secrets:
      - modelscope_key
      - credentials
    profiles: [cli]
    entrypoint: [wp]
    mem_limit: 256m
secrets:
  modelscope_key:
    file: ${LABO_WORK_DIR}/private/modelscope_key
  credentials:
    file: ${LABO_WORK_DIR}/private/credentials.json
volumes:
  db:
  wordpress:
